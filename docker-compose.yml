version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Container
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: algions-sms-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend REST API Container
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algions-sms-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/school_management?schema=public"
      JWT_SECRET: "algions-sms-super-secret-key-assessment-2025"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Frontend Client Container
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algions-sms-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

