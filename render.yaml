services:
  # ==========================================
  # Backend API Service (Node.js + Express)
  # ==========================================
  - type: web
    name: algions-sms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: algions-sms-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  # ==========================================
  # Frontend Client (React + Vite)
  # ==========================================
  - type: web
    name: algions-sms-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: algions-sms-postgres
    plan: free
    databaseName: school_management
    user: postgres

